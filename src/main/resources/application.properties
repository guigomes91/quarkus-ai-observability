# ==========================================================
# quarkus-ai-observability | IA Coders University
# ==========================================================

quarkus.application.name=quarkus-ai-observability

# ---------- IA: Ollama (default, roda local via docker-compose) ----------
quarkus.langchain4j.chat-model.provider=ollama
quarkus.langchain4j.ollama.base-url=http://localhost:11434
quarkus.langchain4j.ollama.chat-model.model-name=llama3.2
quarkus.langchain4j.ollama.timeout=60s
quarkus.langchain4j.ollama.log-requests=false
quarkus.langchain4j.ollama.log-responses=false

# ---------- IA: OpenAI (profile alternativo pra demo de custo real) ----------
# Rodar com: mvn quarkus:dev -Dquarkus.profile=openai
%openai.quarkus.langchain4j.chat-model.provider=openai
%openai.quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
%openai.quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
%openai.quarkus.langchain4j.openai.timeout=60s

# ---------- Pricing (por 1M de tokens, em USD) ----------
# Preco de tabela muda todo mes: por isso vem de config, nunca hardcoded.
# Valores default pensados pro gpt-4o-mini; pro Ollama o custo monetario e zero,
# mas medimos mesmo assim (custo computacional / capacity planning).
llm.pricing.input-per-million=0.15
llm.pricing.output-per-million=0.60

# ---------- Contexto: limite didatico pro cenario da fase 6 ----------
llm.context.warn-threshold-tokens=4000

# ---------- Metricas (Micrometer + Prometheus) ----------
quarkus.micrometer.export.prometheus.enabled=true
# Endpoint padrao: /q/metrics

# ---------- Tracing (OpenTelemetry -> Jaeger via OTLP) ----------
quarkus.otel.exporter.otlp.traces.endpoint=http://localhost:4317
quarkus.otel.traces.sampler=always_on

# ---------- Logs ----------
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n
